<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Spherical Glass Lens</title>
<style>
  html, body {
    height: 100%;
    min-height: 300vh;
    margin: 0;
    font-family: system-ui, sans-serif;
    overflow-x: hidden;
    background: #000;
  }
  
  .bg {
    position: absolute; /* Make it absolute so it scrolls naturally with the page */
    inset: 0;
    z-index: 0;
  }
  
  .bg img {
    width: 100%;
    display: block;
    object-fit: cover;
  }

  .glass-container {
    position: fixed;
    inset: 50% auto auto 50%;
    transform: translate(-50%, -50%);
    width: 480px;
    height: 320px;
    z-index: 10;
  }

  .frost-layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border-radius: 2rem;
    
    /* Constant blur/refraction */
    backdrop-filter: url(#glass-dispersion);
    -webkit-backdrop-filter: url(#glass-dispersion);
  }

  .glass-3d-overlay {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border-radius: 2rem;
    background: transparent;
    
    /* Light -63° 80% & Depth 29 */
    border: none; 
    
    /* box-shadow removed */
    outline: 0;
    transition: transform 0.3s ease;
  }

  /* removed ::before */


  
</style>
</head>

  <img src="bg3.png" alt="">
</div>

      <img src="Vibrant-Summer-Meadow-Watercolor.png" style="width: 100%; display: block;" alt="">

<script>
  const bg = document.getElementById('internal-bg');
  let lastScrollY = -1;
  
  function updateGlass() {
    const scrollY = window.scrollY;
    if (scrollY !== lastScrollY && bg) {
      bg.style.top = `calc(-50vh + 160px - ${scrollY}px)`;
      bg.style.transformOrigin = `50vw calc(50vh + ${scrollY}px)`;
      lastScrollY = scrollY;
    }
    requestAnimationFrame(updateGlass);
  }
  
  requestAnimationFrame(updateGlass);
</script>
